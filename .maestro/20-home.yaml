appId: io.aragonite.notes.debug
---
# Home (newspaper layout, English app language): masthead, lead story, columns and thumbnails for notes that never had one.
- launchApp
- extendedWaitUntil:
    visible: "Notes"
    timeout: 20000
- assertVisible: "THY Rapor"
- assertVisible: "Yeni Finans Ürün Planı"
- assertVisible: "Gün 1- 14 Eylül"
- assertVisible: ".*NEW NOTE"
- assertVisible: "Settings"
# thumbnails are rendered in the background (long notes take a while)
- extendedWaitUntil:
    visible: "Notes"
    timeout: 90000
- takeScreenshot: .e2e-shots/home
